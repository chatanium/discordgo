language: go
go:
    - 1.27.3
env:
    - GO111MODULE=on GOTOOLCHAIN=local GOWORK=off GOFLAGS=-mod=readonly
install:
    - go mod download
    - go -C examples/linked_roles mod download
    - go -C examples/voice_receive mod download
script:
    - diff <(gofmt -d .) <(echo -n)
    - go vet ./...
    - go test -v -race ./...
    - go -C examples/linked_roles vet ./...
    - go -C examples/linked_roles test -v -race ./...
    - go -C examples/voice_receive vet ./...
    - go -C examples/voice_receive test -v -race ./...
