name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOWORK: "off"
  GOFLAGS: -mod=readonly

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
      - name: Check diff between gofmt and code
        run: diff <(gofmt -d .) <(echo -n)

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [".", "examples/linked_roles", "examples/voice_receive"]
    steps:
      - name: Code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache-dependency-path: |
            go.sum
            examples/linked_roles/go.sum
            examples/voice_receive/go.sum
      - name: Test SDK or independent example module
        working-directory: ${{ matrix.module }}
        run: go test -v -race ./...

  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [".", "examples/linked_roles", "examples/voice_receive"]
    steps:
      - name: Code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache-dependency-path: |
            go.sum
            examples/linked_roles/go.sum
            examples/voice_receive/go.sum
      - name: Go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
